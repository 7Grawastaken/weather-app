<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 55 420 420" width="420" height="420">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD24D" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FFD24D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD24D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="100%" stop-color="#FFB627"/>
    </radialGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B6CFF"/>
      <stop offset="100%" stop-color="#3A3FD1"/>
    </linearGradient>
  </defs>

  <!-- soft glow -->
  <circle cx="265" cy="265" r="205" fill="url(#glow)"/>

  <!-- cloud (behind sun) -->
  <g fill="#E4E7EE">
    <circle cx="118" cy="232" r="46"/>
    <circle cx="178" cy="168" r="62"/>
    <circle cx="256" cy="160" r="50"/>
    <rect x="118" y="215" width="150" height="63" rx="31"/>
  </g>

  <!-- sun -->
  <circle cx="282" cy="288" r="140" fill="url(#sun)"/>

  <!-- rain -->
  <g stroke="#4650D8" stroke-width="24" stroke-linecap="round" fill="none">
    <line x1="338" y1="262" x2="338" y2="340"/>
    <line x1="384" y1="250" x2="384" y2="372"/>
    <line x1="430" y1="272" x2="430" y2="332"/>
  </g>
</svg>
